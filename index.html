<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>מחברת חזרה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&family=Suez+One&display=swap">
<style>
/* Layout: right-hand course rail + one working column. Tabs switch between four ways to revise: quick pass, full summaries, glossary, flashcards. */
:root {
  --bg: #eef1f3;
  --surface: #ffffff;
  --ink: #16222b;
  --muted: #566672;
  --line: #d6dde2;
  --accent: #0e6b6b;
  --accent-soft: #d9eeee;
  --accent-ink: #ffffff;
  --warm: #86500c;
  --warm-soft: #f6e6cc;
  --flash: #fff3b8;
  --font-display: "Suez One", "David Libre", "Times New Roman", serif;
  --font-body: "Alef", "Heebo", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171c;
    --surface: #172229;
    --ink: #e6edf1;
    --muted: #96a7b3;
    --line: #2a3a44;
    --accent: #5cc4c0;
    --accent-soft: #16393a;
    --accent-ink: #0b1a1a;
    --warm: #e3a857;
    --warm-soft: #3a2c14;
    --flash: #4a4116;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171c;
  --surface: #172229;
  --ink: #e6edf1;
  --muted: #96a7b3;
  --line: #2a3a44;
  --accent: #5cc4c0;
  --accent-soft: #16393a;
  --accent-ink: #0b1a1a;
  --warm: #e3a857;
  --warm-soft: #3a2c14;
  --flash: #4a4116;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { direction: rtl; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.65;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  max-width: 1120px;
  margin-inline: auto;
  display: grid;
  grid-template-columns: 250px minmax(0, 1fr);
  gap: 36px;
  align-items: start;
}

/* course rail */
.side { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 14px; }
.side h2 {
  margin: 0;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--muted);
}
.tracks { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.track { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.track h2 {
  padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 19px;
  letter-spacing: 0;
}
.eyebrow { margin: 0 0 4px; font-size: 14px; font-weight: 700; letter-spacing: 0.04em; color: var(--accent); }
.courses { display: flex; flex-direction: column; gap: 6px; }
.course {
  text-align: right;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 10px 12px;
  line-height: 1.35;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.course:hover { background: var(--surface); border-color: var(--line); }
.course[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); }
.course b { font-weight: 700; font-size: 16px; }
.course small { color: var(--muted); font-size: 13.5px; }

/* main */
main { min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.head h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(30px, 5vw, 46px);
  line-height: 1.15;
  text-wrap: balance;
}
.head p { margin: 6px 0 0; color: var(--muted); }

.bar {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 20px;
  align-items: flex-end;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
}
.tabs { display: flex; flex-wrap: wrap; gap: 4px 22px; }
.tab {
  background: none;
  border: 0;
  border-bottom: 3px solid transparent;
  padding: 8px 2px 9px;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: -1px;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.search { padding-bottom: 8px; flex: 1 1 200px; max-width: 320px; }
.search input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 7px 12px;
}
.search input::placeholder { color: var(--muted); }

.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 14px;
  font-size: 15px;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.tools .sep { color: var(--muted); font-size: 14px; margin-inline-start: 6px; }

.note { margin: 0; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font-size: 15.5px; line-height: 1.6; max-width: 80ch; }

/* source tags */
.tag {
  display: inline-block;
  font-size: 13px;
  font-weight: 700;
  padding: 1px 9px;
  border-radius: 4px;
  white-space: nowrap;
}
.tag.mine { background: var(--accent-soft); color: var(--accent); }
.tag.read { background: var(--warm-soft); color: var(--warm); }

/* inline concept */
.term {
  background: none;
  border: 0;
  border-bottom: 1.5px dotted var(--accent);
  padding: 0;
  font-weight: 600;
  color: inherit;
  line-height: inherit;
}
.term:hover { background: var(--accent-soft); }
.pop {
  position: fixed;
  z-index: 20;
  max-width: 290px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
  padding: 12px 14px;
  font-size: 15.5px;
  line-height: 1.5;
}
.pop b { display: block; font-family: var(--font-display); font-size: 18px; margin-bottom: 2px; }
.pop button { margin-top: 8px; background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; font-size: 14.5px; }

/* quick review */
.rows { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.row { padding: 18px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 4px 18px; }
.row .wk { color: var(--muted); font-weight: 700; font-size: 14.5px; padding-top: 6px; }
.row h3 { margin: 0; font-family: var(--font-display); font-size: 25px; line-height: 1.25; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.row .tldr { margin: 6px 0 10px; max-width: 68ch; }
.quiz .row:not(.shown) .tldr { filter: blur(7px); cursor: pointer; user-select: none; }
.quiz .row:not(.shown) .tldr::after { content: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 6px; padding: 0; list-style: none; }
.chips button {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 1px 10px;
  font-size: 15px;
}
.chips button:hover { border-color: var(--accent); color: var(--accent); }
details summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 15px; width: fit-content; }
details ul { margin: 8px 0 0; padding-inline-start: 22px; max-width: 68ch; }
details li { margin-bottom: 5px; }

/* summaries */
.stack { display: flex; flex-direction: column; gap: 18px; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 22px 24px;
  scroll-margin-top: 16px;
}
.card.flash, .entry.flash { animation: flash 1.6s ease; }
@keyframes flash { 0%, 40% { background: var(--flash); } 100% { background: var(--surface); } }
.card header { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; margin-bottom: 10px; }
.card h3 { margin: 0; font-family: var(--font-display); font-size: 28px; line-height: 1.2; text-wrap: balance; }
.card .src { color: var(--muted); font-size: 14.5px; margin: 0 0 12px; }
.card .lead { font-size: 18.5px; font-weight: 600; margin: 0 0 12px; max-width: 66ch; }
.card ul { margin: 0 0 16px; padding-inline-start: 22px; max-width: 68ch; }
.card li { margin-bottom: 7px; }
.card h4 { margin: 18px 0 6px; font-size: 13px; letter-spacing: 0.06em; color: var(--muted); }
.card ol { margin: 0; padding-inline-start: 22px; max-width: 68ch; }
.card ol li { color: var(--muted); }

/* glossary */
.dict { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 14px; }
.entry { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; scroll-margin-top: 16px; }
.entry h3 { margin: 0 0 3px; font-family: var(--font-display); font-size: 22px; }
.entry p { margin: 0 0 8px; }
.entry .in { font-size: 14.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
.entry .in button { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; font-size: 14.5px; text-align: right; }
.entry .in button:hover { text-decoration: underline; }

/* flashcards */
.deck { display: flex; flex-direction: column; gap: 16px; align-items: center; }
.meter { width: 100%; max-width: 640px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 15px; }
.meter b { color: var(--ink); font-variant-numeric: tabular-nums; }
.bar-track { width: 100%; max-width: 640px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); }
.flip {
  width: 100%;
  max-width: 640px;
  min-height: 250px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 28px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.flip .k { font-size: 13px; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
.flip .front { font-family: var(--font-display); font-size: clamp(30px, 6vw, 44px); font-weight: 400; line-height: 1.2; }
.flip .back { font-size: 20px; max-width: 46ch; }
.flip .hint { color: var(--muted); font-size: 14.5px; }
.flip .where { font-size: 14px; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 20px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: none; }
.btn:disabled { opacity: 0.45; cursor: default; }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 36px 24px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-family: var(--font-display); font-size: 22px; margin-bottom: 4px; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .side { position: static; }
  .courses { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
  .course { flex: 0 0 auto; min-width: 190px; border-color: var(--line); background: var(--surface); }
  .row { grid-template-columns: minmax(0, 1fr); }
  .row .wk { padding-top: 0; }
  .card { padding: 18px 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .card.flash, .entry.flash { animation: none; }
}
h1, h2, h3, .pop b, .empty b { font-weight: 400; }
:root { font-synthesis: none; }
</style>
</head>
<body>

<div class="app">
  <aside class="side" aria-label="קורסים">
    <div class="tracks" id="courses"></div>
  </aside>

  <main>
    <header class="head">
      <p class="eyebrow" id="ctrack"></p>
      <h1 id="ctitle"></h1>
      <p id="cmeta"></p>
    </header>

    <p class="note" id="cnote" hidden></p>

    <div class="bar">
      <div class="tabs" role="tablist" id="tabs"></div>
      <label class="search"><input id="q" type="search" placeholder="חיפוש בקורס" autocomplete="off"></label>
    </div>

    <section id="content" aria-live="polite"></section>
  </main>
</div>

<div class="pop" id="pop" hidden></div>

<script>
/* ---------- courses ---------- */
var TRACKS = [
  { id: 'ps', name: 'מדעי המדינה' },
  { id: 'mes', name: 'לימודי המזרח התיכון' }
];
var COURSES = [
  { id: 'soc', track: 'ps', name: 'חברה, פוליטיקה ותרבות בעידן החדש' },
  { id: 'isr', track: 'ps', name: 'יסודות המשטר והפוליטיקה בישראל' },
  { id: 'gov', track: 'ps', name: "מבוא לממשל ופוליטיקה א'" },
  { id: 'rm', track: 'ps', name: 'שיטות מחקר ושימושי מחשב' },
  { id: 'thought', track: 'ps', name: "תולדות המחשבה המדינית א'" },
  { id: 'mehist', track: 'mes', name: 'מבוא לתולדות המזרח התיכון בעת החדשה' },
  { id: 'islam', track: 'mes', name: 'מבוא לתולדות האסלאם' },
  { id: 'ott', track: 'mes', name: "מבוא לתולדות האימפריה העות'מנית" },
  { id: 'orient', track: 'mes', name: 'מבוא למזרחנות' }
];

var TERMS = {};
var TOPICS = [];
var DATA = {};
DATA.mehist = {
  note: 'מרצה: ד"ר אלישבע מכליס. הציון: שתי בחינות (40% כל אחת, אחת בכל סמסטר) ושתי מטלות (10% כל אחת). הבחינה בכתיבה ארוכה ולא אמריקאית. בסמסטר א\' יש חלק של מושגים, שבו כותבים פסקה על כל מושג (למשל דאר אל-אסלאם וג\'האד), וחלק של שאלות רוחב. הבחינה נעשית במערכת טו-מקס.',
  terms: {
    'dar-islam': { t: 'דאר אל-אסלאם (מרחב האסלאם)', d: 'אזור גאוגרפי, ללא גבולות מוגדרים, שנמצא תחת שליטה פוליטית-דתית מוסלמית. ההגדרה באה מחכמי המשפט המוסלמי, והיא נשארת פתוחה כי המטרה היא להתרחב.' },
    'dar-harb': { t: 'דאר אל-חרב', d: 'כל המרחב שמחוץ לדאר אל-אסלאם. לפי האסלאם הוא ניתן לכיבוש ויכול להפוך בעתיד לחלק מהאימפריה.' },
    'jihad': { t: 'ג\'האד', d: 'מאמץ. יש שני סוגים: ג\'האד גדול, פנימי, וג\'האד קטן, לוחמני.' },
    'jihad-big': { t: 'ג\'האד גדול (אל-אכבר)', d: 'המאמץ הפנימי להיות מוסלמי טוב יותר: להאמין וללכת לפי ההלכה. נקרא גם ג\'האד אל-נפס, והוא הערך העליון באסלאם המקורי.' },
    'jihad-small': { t: 'ג\'האד קטן', d: 'הצד הלוחמני, הכיבוש. יש בו תתי-קטגוריות כמו ג\'האד התקפי וג\'האד הגנתי. הערך התחתון באסלאם המקורי.' },
    'jihadist-movements': { t: 'תנועות ג\'האדיסטיות', d: 'תנועות שהפכו את סדר הערכים: אצלן המלחמה היא הערך החשוב ביותר, והן ביטלו שאלות שהיו סביב מלחמה בעבר, כמו מי מכריז עליה והאם היא התקפית או הגנתית.' },
    'ethnic': { t: 'מוצא אתני', d: 'שייכות לעם, לתרבות ולשפה, ללא קשר לדת. "ערבי" התחיל כמושג אתני, ולכן אפשר לדבר גם על נוצרים ועל יהודים ערבים.' },
    'pan-arabism': { t: 'פאן-ערביות', d: 'תנועה מסוף המאה ה-19 שמדברת על אחדות או קשר של כלל הערבים. חילונית, ומדברת על זהות ערבית ולא על האסלאם. קמה בעיקר בסוריה ובלבנון, בהשתתפות משמעותית של נוצרים, ושילבה התנגדות לשליטה זרה.' },
    'qawmiyya': { t: 'קומיה', d: 'הדגש על העם הערבי כולו, כל הערבים באשר הם.' },
    'wataniyya': { t: 'וטניה', d: 'המולדת היחידה: טריטוריה ולאום מדינתי ספציפי, כמו לבנוני או סורי. משנות החמישים מדברים עליה יותר, ולעיתים היא מתעמתת עם הקומיה.' },
    'muslim': { t: 'מוסלמי', d: 'מי שמגדיר את עצמו כנולד למשפחה דתית. יכול להיות ערבי, טורקי או בן עם אחר, גם מחוץ למזרח התיכון.' },
    'abrahamic': { t: 'דתות אברהמיות', d: 'יהדות, נצרות ואסלאם. מוחמד לא ביטל את הדתות המונותאיסטיות הקודמות, והאסלאם מקבל את הנביאים שלהן.' },
    'khatam': { t: 'חותם הנביאים', d: 'מוחמד הוא הנביא האחרון. אחריו יכולים לקום מנהיגים פוליטיים (ח\'ליף) אך לא נביאים. אין על כך ויכוח.' },
    'usul-din': { t: 'אציל אל-דין (יסודות האמונה)', d: 'שלושה יסודות שכל המוסלמים מאמינים בהם: תוחיד, נבוה ומעאד. השיעים מוסיפים אמאמה ועדל.' },
    'tawhid': { t: 'תוחיד', d: 'ייחוד האל, האמונה באל אחד. העיקרון החשוב ביותר באסלאם, ואין עליו ויכוח.' },
    'nubuwwa': { t: 'נבוה', d: 'האמונה במוחמד כנביא האחרון ובבשורה שלו.' },
    'maad': { t: 'מעאד', d: 'תחיית המתים.' },
    'imama': { t: 'אמאמה', d: 'יסוד שהשיעים מוסיפים לשלושת היסודות. בסיכום מצוין בהקשר של "הקדושים השיעים".' },
    'adl': { t: 'עדל', d: 'יסוד שהשיעים מוסיפים: צדק באחרית הימים.' },
    'arkan': { t: 'ארכאן אל-אסלאם', d: 'חמשת היסודות המעשיים: שהאדה, צ\'אלאט, זכאת, סאום וחאג\'.' },

function loadCourse(id) { var d = DATA[id]; TERMS = d ? d.terms : {}; TOPICS = d ? d.topics : []; }

/* ---------- state ---------- */
var state = { course: 'mehist', view: 'review', q: '', src: 'all', quiz: false, idx: 0, flipped: false, onlyNew: false, known: {} };
try {
  var saved = JSON.parse(localStorage.getItem('known-terms') || '{}');

} catch (e) {}

/* ---------- helpers ---------- */
var $ = function (id) { return document.getElementById(id); };
var MARK = /\{\{([^|}]+)\|([^}]+)\}\}/g;

function rich(s) { return s.replace(MARK, function (m, id, txt) { return '<button class="term" data-term="' + id + '">' + txt + '</button>'; }); }
function termsOf(t) {

}
function topicsOfTerm(id) { return TOPICS.filter(function (t) { return termsOf(t).indexOf(id) > -1; }); }
function allTermIds() { return Object.keys(TERMS).sort(function (a, b) { return TERMS[a].t.localeCompare(TERMS[b].t, 'he'); }); }
function tagHtml(t) { return '<span class="tag ' + t.src + '">' + (t.src === 'mine' ? 'על הסיכום שלי' : 'על חומר קריאה') + '</span>'; }
function haystack(t) { return (t.title + ' ' + strip(t.tldr) + ' ' + t.pts.map(strip).join(' ') + ' ' + t.qs.join(' ')).toLowerCase(); }
function topicVisible(t) {
  if (state.src !== 'all' && t.src !== state.src) return false;
  return !state.q || haystack(t).indexOf(state.q) > -1;
}
function termVisible(id) {

}
function course() { return COURSES.filter(function (c) { return c.id === state.course; })[0]; }

/* ---------- rendering ---------- */
function renderCourses() {
  $('courses').innerHTML = TRACKS.map(function (t) {
    var items = COURSES.filter(function (c) { return c.track === t.id; }).map(function (c) {
      var dd = DATA[c.id]; var meta = dd ? dd.topics.length + ' נושאים · ' + Object.keys(dd.terms).length + ' מושגים' : 'עדיין ריק';
      return '<button class="course" data-course="' + c.id + '"' + (c.id === state.course ? ' aria-current="true"' : '') + '><b>' + c.name + '</b><small>' + meta + '</small></button>';
    }).join('');

  }).join('');
}
function renderHead() {
  var c = course();

  $('ctitle').textContent = c.name;

/* ---------- popover ---------- */
function hidePop() { $('pop').hidden = true; }
function showPop(btn, id) {
  var p = $('pop'), x = TERMS[id];
  if (!x) return;
  p.innerHTML = '<b>' + x.t + '</b>' + x.d + '<br><button data-goterm="' + id + '">פתח במילון</button>';
  p.hidden = false;
  var r = btn.getBoundingClientRect(), w = p.offsetWidth, h = p.offsetHeight;
  var left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), window.innerWidth - w - 8);
  var top = r.bottom + 8;
  if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 8);

  p.style.top = top + 'px';
}

/* ---------- events ---------- */
document.addEventListener('click', function (e) {
  var el = e.target.closest('button, .tldr');

  if (el.classList.contains('tldr')) { var row = el.closest('.row'); if (row) row.classList.toggle('shown'); return; }

  if (d.know) { state.known[kk(d.know)] = 1; saveKnown(); state.flipped = false; if (state.onlyNew) { var m = deckIds().length; if (state.idx >= m) state.idx = 0; } else { state.idx = (state.idx + 1) % deckIds().length; } return renderContent(); }
  if (d.again) { delete state.known[kk(d.again)]; saveKnown(); state.flipped = false; state.idx = (state.idx + 1) % deckIds().length; return renderContent(); }
  if (d.onlynew) { state.onlyNew = !state.onlyNew; state.idx = 0; state.flipped = false; return renderContent(); }
  if (d.reset) { Object.keys(state.known).forEach(function (k) { if (k.indexOf(state.course + ':') === 0) delete state.known[k]; }); saveKnown(); state.onlyNew = false; state.idx = 0; return renderContent(); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') hidePop();
  if (state.view === 'cards' && e.key === ' ' && document.activeElement && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'BUTTON') {
    e.preventDefault(); state.flipped = !state.flipped; renderContent();
  }
});
window.addEventListener('scroll', hidePop, { passive: true });
$('q').addEventListener('input', function (e) { state.q = e.target.value.trim().toLowerCase(); renderContent(); });
window.addEventListener('hashchange', function () {
  var h = location.hash.replace('#', '');
  if (VIEWS.some(function (v) { return v[0] === h; }) && h !== state.view) { state.view = h; renderHead(); renderContent(); }
});

var h0 = location.hash.replace('#', '');
if (VIEWS.some(function (v) { return v[0] === h0; })) state.view = h0;
loadCourse(state.course);
renderAll();
